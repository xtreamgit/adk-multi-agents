# =============================================================================
# Develom (Root) Environment Configuration
# =============================================================================
# Active production environment for the develom account
# Project: adk-rag-ma | Region: us-west1
# =============================================================================

client_name: "develom"
account_env: "develom"

# Google Cloud Project
project_id: "adk-rag-ma"
project_number: "351592762922"
region: "us-west1"
organization_domain: "develom.com"

# IAP / Admin
iap_admin_user: "hector@develom.com"

# Repository
repo: "cloud-run-repo1"

# ---- Database Configuration ----

database:
  cloud_sql_instance: "adk-multi-agents-db"
  cloud_sql_connection: "adk-rag-ma:us-west1:adk-multi-agents-db"
  name: "adk_agents_db"
  user: "adk_app_user"
  password: ""
  password_secret_name: ""

  local:
    host: "localhost"
    port: 5433
    name: "adk_agents_db_dev"
    user: "adk_dev_user"
    password: "dev_password_123"

# ---- Vertex AI Configuration ----

vertex_ai:
  location: "us-west1"
  embedding_model: "publishers/google/models/text-embedding-005"
  embedding_requests_per_min: 1000

# ---- RAG Settings ----

rag:
  default_chunk_size: 512
  default_chunk_overlap: 100
  default_top_k: 3
  default_distance_threshold: 0.5

# ---- Corpus to GCS Bucket Mapping ----

corpus_to_bucket_mapping:
  "ai-books": "ipad-book-collection"
  "general-docs": "develom-documents"

default_corpus_name: "ai-books"

# ---- Frontend Configuration ----

frontend:
  backend_url: ""

# ---- Secrets ----

secrets:
  secret_key_source: "file"
  secret_key_secret_name: ""

# ---- Service Accounts ----

service_accounts:
  backend_sa: ""
  frontend_sa: ""
  rag_agent_sa: ""

# ---- Seed Data ----
# Baseline users, groups, and permissions for a fresh deployment.
# Corpora are NOT seeded here — they come from Vertex AI via sync_corpora_from_vertex.py.
# Group-corpus access uses corpus names (resolved at seed time against the corpora table).

seed_data:
  users:
    - username: "hector"
      email: "hector@develom.com"
      full_name: "Hector DeJesus"
      password: "hector123"
      auth_provider: "local"

    - username: "mila"
      email: "mila@develom.com"
      full_name: "Mila Hughes"
      password: "mila123"
      auth_provider: "local"

    - username: "alice"
      email: "alice@test.com"
      full_name: "Alice Test"
      password: "alice123"
      auth_provider: "local"

    - username: "test-writer"
      email: "test-writer@develom.com"
      full_name: "Test Writer"
      password: "writer123"
      auth_provider: "local"

  groups:
    - name: "admin-users"
      description: "Administrators with full system access"

    - name: "users"
      description: "Default user group"

    - name: "viewers"
      description: "Users with read-only access"

    - name: "managers"
      description: "Managers with oversight access"

    - name: "developers"
      description: "Software developers with full access"

    - name: "develom-group"
      description: "Develom organization users"

    - name: "default-users"
      description: "Default group for all users"

  # user_group memberships: username → list of group names
  memberships:
    hector:
      - "users"
      - "admin-users"
    mila:
      - "users"
      - "admin-users"
    alice:
      - "admin-users"
    test-writer:
      - "users"
      - "admin-users"

  # group_corpus_access: group_name → list of {corpus_name, permission}
  # Corpus names are matched against the corpora table (populated by sync_corpora_from_vertex.py)
  group_corpus_access:
    admin-users:
      - corpus: "ai-books"
        permission: "admin"
      - corpus: "test-corpus"
        permission: "admin"
      - corpus: "design"
        permission: "admin"
      - corpus: "management"
        permission: "admin"

    viewers:
      - corpus: "ai-books"
        permission: "read"
      - corpus: "test-corpus"
        permission: "read"
      - corpus: "design"
        permission: "read"
      - corpus: "management"
        permission: "read"

    managers:
      - corpus: "ai-books"
        permission: "admin"
      - corpus: "test-corpus"
        permission: "admin"
      - corpus: "design"
        permission: "admin"
      - corpus: "management"
        permission: "admin"

    developers:
      - corpus: "ai-books"
        permission: "admin"
      - corpus: "test-corpus"
        permission: "admin"
      - corpus: "design"
        permission: "admin"
      - corpus: "management"
        permission: "admin"

    develom-group:
      - corpus: "ai-books"
        permission: "read"
      - corpus: "test-corpus"
        permission: "write"
      - corpus: "design"
        permission: "read"
      - corpus: "management"
        permission: "read"
